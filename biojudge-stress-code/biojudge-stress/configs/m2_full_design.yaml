# The complete design in the data-model document: 150 evaluation items (50 per benchmark) in two fixed
# batches, a disjoint 12-item development set, cleaning and de-duplication, and the 30-250 word bound.
# The verdicts in the paper come from the reduced-scale run, configs/ollama_l40s_ctrl.yaml; this file
# has not been run on real models. Check its size first, then run the pilot, then the batches:
#
#   python -m biojudge.run --config configs/m2_full_design.yaml --estimate
#   python -m biojudge.run --config configs/m2_full_design.yaml --split dev --stages items,solo,generate,perturb,judge
#   python -m biojudge.run --config configs/m2_full_design.yaml --batch 1 --stages items,solo,generate,perturb,judge,select
#   python -m biojudge.run --config configs/m2_full_design.yaml --batch 2 --stages items,solo,generate,perturb,judge,select
#
# Every call is cached per run directory, so a stopped session loses nothing: re-run the same command.
run_name: m2_full
out_dir: runs
seed: 2026

data:
  domains:
    literature:   {source: pubmedqa,      n: 50}
    clinical:     {source: medqa,         n: 50}
    pharmacology: {source: medmcqa_pharm, n: 50}
  distractor: hard
  preprocess: true
  dev_per_domain: 4
  exclude_items_from: runs/local/items.jsonl   # keep the stored run's items out of the new batches

_ollama: &ol
  provider: openai
  base_url: http://127.0.0.1:11434/v1
  api_key_env: OLLAMA_API_KEY

models:
  llama:   {<<: *ol, model: "llama3.2:3b",    family: llama,   display: Llama-3.2-3B}
  qwen:    {<<: *ol, model: "qwen2.5:3b",     family: qwen,    display: Qwen2.5-3B}
  gemma:   {<<: *ol, model: "gemma2:2b",      family: gemma,   display: Gemma-2-2B, merge_system: true}
  mistral: {<<: *ol, model: "ministral-3:3b", family: mistral, display: Ministral-3-3B}
  phi:     {<<: *ol, model: "phi4-mini",      family: phi,     display: Phi-4-mini}

roles:
  generators: [llama, qwen, gemma, mistral]
  judges:     [llama, qwen, gemma, mistral]
  utility: phi

experiment:
  protocols: [base_raw, debias_raw, base_norm, debias_norm, base_strip]
  attacks: [authority, citation, format, confidence, injection, combo]
  attacks_control: [placebo, consensus]
  control_protocols: [base_raw, debias_raw, base_norm, debias_norm, base_strip]
  attacks_sym: [authority, citation, format, confidence, injection]
  sym_protocols: [base_raw]
  attack_pairs_per_item: 2
  pad_mode: llm
  pad_ratio: 2.5
  select: {enabled: true, protocols: [base_raw, debias_norm]}

generation:
  rationale_max_words: 250

runtime:
  concurrency: 8
  request_timeout: 300
  max_api_retries: 4

analysis:
  bootstrap: 2000
